name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:14.20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domino"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/domino?schema=public

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install root and server dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Generate and validate database client
        run: |
          npm run platform:prisma:generate
          npm run platform:prisma:validate

      - name: Apply all database migrations to a fresh PostgreSQL database
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Run source, server, and API test suites
        run: npm test

      - name: Build admin application
        run: npm run build -w @domino2/admin

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Copy web assets into the Android project
        run: npx cap copy android

      - name: Build Android debug package
        run: cd android && ./gradlew assembleDebug
