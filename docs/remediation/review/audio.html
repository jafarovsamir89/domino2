<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domino — проверка звука</title><style>body{font:18px system-ui;max-width:650px;margin:24px auto;padding:16px;background:#12251e;color:#fff}button,a{display:inline-block;margin:8px;padding:12px;font:inherit}label{display:block;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input{max-width:100%}</style></head><body>
<h1>Проверка звука и микрофона</h1><p>Отдельная тестовая сборка. Звук микрофона не записывается и не отправляется. Проверка связи между двумя телефонами проводится отдельно.</p>
<label><input id="mute" type="checkbox"> Выключить весь звук</label><label>Музыка <input id="music" type="range" min="0" max="1" step="0.05"></label><label>Эффекты <input id="effects" type="range" min="0" max="1" step="0.05"></label>
<button id="play">Музыка</button><button id="sfx">Эффект</button><button id="stop">Стоп</button><button id="mic">Разрешить микрофон</button><button id="end">Остановить микрофон</button><a href="/">К игре</a><pre id="state" role="status"></pre>
<script type="module" src="/review/media-fixture.js"></script></body></html>
