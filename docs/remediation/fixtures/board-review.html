<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>Local board review</title><link rel="stylesheet" href="/css/style.css"><style>body{display:block;background:#0b1511;padding:12px;color:#eee}main{max-width:390px;margin:auto}header{display:flex;align-items:center;gap:12px;height:64px}#review-board{position:relative;width:100%;height:560px;background:#194532;border-radius:16px;overflow:hidden}button,select{font:inherit;padding:8px}p{font-size:14px}</style><script src="/js/vendor/konva.min.js"></script></head><body><main><header><label>Костяшки <select id="count"><option>20</option><option selected>28</option></select></label></header><div id="review-board"></div><p>Локальный макет поля. Увеличьте стол, сдвиньте пальцем и верните общий вид.</p></main><script type="module">
const base=new URLSearchParams(location.search).get('bundle')==='www'?'/www/':'/';
const [{KonvaBoardRenderer},{Board},{Tile},{translations}]=await Promise.all(['konvaBoardRenderer','board','model','translations'].map(file=>import(base+'js/'+file+'.js')));
const fixture=await (await fetch('/e2e/fixtures/board-quality.json')).json();
window.reviewRenderer=new KonvaBoardRenderer({app:{t:key=>translations.ru[key]||key},containerEl:document.getElementById('review-board')});reviewRenderer.mount();
function render(){const board=new Board();for(const row of fixture.slice(0,Number(document.getElementById('count').value))){const tile=new Tile(row.a,row.b);if(board.isEmpty)board.placeFirst(tile);else board.placeTile(tile,row.openEndIndex)}reviewRenderer.render(board,{force:true})}
document.getElementById('count').addEventListener('change',render);render();
</script></body></html>
